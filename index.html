/* ===== STORAGE LAYER — the only code that touches storage.
   Next phase (Supabase): swap these bodies for API calls. Shapes stay the same.
   Every write returns true or false; callers must check before clearing anything. ===== */
const Store={mode:'this browser',
  _g(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  _s(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},
  getWork(){return this._g('leo_working_sheet_v1',null)},
  setWork(w){if(!w){localStorage.removeItem('leo_working_sheet_v1');return true}return this._s('leo_working_sheet_v1',w)},
  attempts(){return this._g('leo_contact_attempts_v1',[])},
  addAttempt(a){const x=this.attempts();x.push(a);return this._s('leo_contact_attempts_v1',x)?a:null},
  archives(){return this._g('leo_archives_v1',[])},
  setArchives(x){return this._s('leo_archives_v1',x)},
  addArchive(r){const x=this.archives();x.push(r);return this._s('leo_archives_v1',x)},
  bytes(){let n=0;try{['leo_working_sheet_v1','leo_contact_attempts_v1','leo_archives_v1'].forEach(k=>{const v=localStorage.getItem(k);if(v)n+=v.length})}catch(e){}return n},
  backup(){return {leo_backup:6,exported_at:new Date().toISOString(),working_sheet:this.getWork(),attempts:this.attempts(),archives:this.archives()}},
  restore(b){if(!b||typeof b!=='object'||!Array.isArray(b.attempts)||!Array.isArray(b.archives))return 'That file is not a LEO backup.';
    const keep={w:this.getWork(),a:this.attempts(),r:this.archives()};
    if(this._s('leo_contact_attempts_v1',b.attempts)&&this._s('leo_archives_v1',b.archives)&&this.setWork(b.working_sheet||null))return '';
    this._s('leo_contact_attempts_v1',keep.a);this._s('leo_archives_v1',keep.r);this.setWork(keep.w);
    return 'That backup is too big for this browser. Nothing was changed.'}};

    for(let i=0;i<rows.length;i+=400){
      const {error}=await this.client.from('contact_attempts').upsert(rows.slice(i,i+400),{onConflict:'agent_id,attempt_uid'});

    if(!sheets||!sheets.length)return {work:null,attempts:[],archives:[]};

    const byId={};sheets.forEach(x=>{this.ids[x.sheet_uid]=x.id;byId[x.id]=x});
    const L={},A={};
    (leads||[]).forEach(l=>{(L[l.sheet_id]=L[l.sheet_id]||[]).push({key:l.lead_key,db_id:l.db_id,

    (atts||[]).forEach(a=>{(A[a.sheet_id]=A[a.sheet_id]||[]).push({attempt_uid:a.attempt_uid,
      sheet_uid:byId[a.sheet_id]?byId[a.sheet_id].sheet_uid:'',lead_key:a.lead_key,lead_id:a.db_lead_id,
      phone:a.phone||'',standard_outcome:a.standard_outcome,original_text:a.original_text||'',
      callback_at:a.callback_at,callback_reason:a.callback_reason||'',logged_at:a.logged_at,
      source:a.source||'dashboard',schema_version:a.schema_version||4})});
    const work=s=>({uid:s.sheet_uid,name:s.name,origin:s.origin,created:s.created,leads:L[s.id]||[]});
    const ws=sheets.find(x=>x.status==='working');

    return {work:ws?work(ws):null,attempts,archives}}

function syncStatus(){const e=document.getElementById('storeTag'),b=document.getElementById('outBtn');if(!e)return;

  Promise.resolve().then(run).then(()=>{Cloud.state='synced';Cloud.note=''})

const OUTCOMES=[['VOICEMAIL','Voicemail'],['INSTANT_VOICEMAIL','Instant voicemail'],['NOT_IN_SERVICE','Not in service'],['INTRO_HANGUP','Intro hangup'],['NOT_INTERESTED','Not interested'],['WRONG_NUMBER','Wrong number'],['AI_SCREEN','AI screen'],['ALREADY_COVERED','Already covered'],['CALLBACK','Callback',1],['SOLD_PENDING_APP','Sold, pending app',1]];
const RETRYCODES=['VOICEMAIL','INSTANT_VOICEMAIL','AI_SCREEN','INTRO_HANGUP'];
/* days to wait before the next try, by number of attempts already made */
const WAIT=[1,2,3,5];const MAXTRIES=5;
const DAY=86400000;
const nice=c=>c?c.replace(/_/g,' ').toLowerCase():'—';
const fmtPhone=p=>{const d=String(p||'').replace(/\D/g,'').replace(/^1(?=\d{10}$)/,'');return d.length===10?`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`:(p||'')};
const fmtWhen=t=>new Date(t).toLocaleString([],{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const fmtDay=t=>{const d=new Date(t),n=new Date();const a=new Date(d.getFullYear(),d.getMonth(),d.getDate()),b=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  const k=Math.round((a-b)/DAY);return k===0?'today':k===1?'tomorrow':k===-1?'yesterday':k<0?Math.abs(k)+' days ago':'in '+k+' days'};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');

function dueAt(lastAt,tries){const w=WAIT[Math.min(tries,WAIT.length)-1];return new Date(new Date(lastAt).getTime()+w*DAY).toISOString()}

/* ===== tags =====
   DNC · Callback (due) · Overdue · Scheduled · Fresh · Retry (due) · Waiting · Rested (tries used up) · Done */
function tagFor(code,cbAt,tries,lastAt,now){
  now=now||new Date();
  if(code==='DO_NOT_CALL')return 'DNC';
  if(!code)return tries>0?'Retry':'Fresh';
  if(code==='CALLBACK'){if(!cbAt)return 'Callback';const d=new Date(cbAt);
    return d>now?'Scheduled':(now-d>DAY?'Overdue':'Callback')}
  if(RETRYCODES.includes(code)){
    if(tries>=MAXTRIES)return 'Rested';
    return new Date(dueAt(lastAt,tries))<=now?'Retry':'Waiting'}
  return 'Done'}
function queueRows(now){const w=Store.getWork();if(!w)return [];
  const A=Store.attempts().filter(a=>a.sheet_uid===w.uid),last={},n={};
  const live={};A.forEach(a=>{const k=a.lead_key,L=live[k]=live[k]||[];
    if(a.standard_outcome==='REQUEUE'){const v=L.pop();if(v)L.push(Object.assign({},v,{_void:1}));L.push(a)}else L.push(a)});
  Object.keys(live).forEach(k=>{const L=live[k];last[k]=L[L.length-1];
    n[k]=L.filter(a=>!a._void&&a.standard_outcome!=='REQUEUE').length});
  return w.leads.map(l=>{const la=last[l.key],back=la&&la.standard_outcome==='REQUEUE';
    const code=back?'':(la?la.standard_outcome:l.prev_outcome);
    const cb=back?null:(la?la.callback_at:null),att=(l.prev_att||0)+(n[l.key]||0),lastAt=la?la.logged_at:'';
    const tag=back?'Fresh':tagFor(code,cb,att,lastAt,now);
    return Object.assign({},l,{tag,last:code,cb,why:la?la.callback_reason:'',lastAt,att,
      due:RETRYCODES.includes(code)&&lastAt?dueAt(lastAt,att):null,note:la?la.original_text:''})})}

    h.textContent=t?(t.ok?'Their time: '+t.label:'Outside calling hours: it is '+t.label+' for them. Best to wait.'):'';
    h.style.color=t&&t.ok?'var(--mute)':''}}
function openPanel(k){sel=k;drawQueue();const p=document.getElementById('panel');if(p)p.scrollIntoView({behavior:'smooth',block:'nearest'})}
function closePanel(){sel=null;pd=false;drawQueue()}
function record(code,cbAt,why){const w=Store.getWork();const l=w&&w.leads.find(x=>x.key===sel);if(!l)return;
  const nEl=document.getElementById('note'),note=nEl?(nEl.value||'').trim():'';
  const saved=Store.addAttempt({attempt_uid:'web-'+uid(),sheet_uid:w.uid,lead_key:l.key,lead_id:l.db_id??null,phone:l.phone,standard_outcome:code,original_text:note,callback_at:cbAt||null,callback_reason:why||'',logged_at:new Date().toISOString(),source:'dashboard',schema_version:4});
  if(!saved){alert('Your browser is out of storage, so this call was NOT saved.\n\nOpen the Database tab, download a full backup, then remove an older archived sheet. Then log the call again.');return}
  sync(()=>Cloud.pushAttempt(saved));
  const msg='Logged: '+(l.name||l.phone)+' · '+nice(code)+(cbAt?' · '+fmtWhen(cbAt):'');
  if(code==='DO_NOT_CALL')toast(msg);else toast(msg,`sendBack('${l.key}')`);if(!pdAdvance(l.key)){sel=null;drawQueue()}}
function logCall(code){
  if(code==='CALLBACK'){const b=document.getElementById('cbBox'),d=new Date();d.setDate(d.getDate()+1);d.setHours(10,0,0,0);
    document.getElementById('cbAt').value=localInput(d);document.getElementById('cbWhy').value='';b.style.display='block';
    document.getElementById('cbAt').focus();return}
  record(code,null,'')}
function saveCallback(){const v=document.getElementById('cbAt').value;if(!v){alert('Pick a date and time for the callback.');return}
  record('CALLBACK',new Date(v).toISOString(),(document.getElementById('cbWhy').value||'').trim())}
function markDNC(){const w=Store.getWork();const l=w&&w.leads.find(x=>x.key===sel);if(!l)return;
